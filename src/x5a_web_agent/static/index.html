<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0b1220" />
  <title>X5A 语音抓取</title>
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
  <main class="app">
    <header class="top">
      <div>
        <p class="eyebrow">ARX X5A · Voice Pick & Place</p>
        <h1>语音抓取</h1>
      </div>
      <div id="linkBadge" class="badge idle">连接中</div>
    </header>

    <section class="card status-card">
      <div class="row">
        <span class="label">机械臂状态</span>
        <span id="busyBadge" class="pill">空闲</span>
      </div>
      <p id="stageText" class="stage">空闲，等待指令</p>
      <p id="stageCode" class="mono">IDLE</p>
      <div class="row">
        <span class="label">手上</span>
        <span id="holdingBadge" class="pill">空手</span>
      </div>
      <p id="resultText" class="result"></p>
    </section>

    <section class="card">
      <span class="label">识别文字</span>
      <p id="transcript" class="value">按住下方按钮说话，松手发送</p>
      <span class="label">解析结果</span>
      <pre id="parsed" class="mono">等待指令</pre>
    </section>

    <section class="talk">
      <p id="speechStatus" class="speech-status">按住说话，或点系统录音</p>
      <button id="talkBtn" type="button" class="mic">
        <span class="pulse" aria-hidden="true"></span>
        <span id="talkLabel">按住 说话</span>
        <small id="talkHint">松手发送 · 像 QQ 语音条</small>
      </button>
      <label class="native-rec">
        点这里用系统录音（推荐）
        <input id="nativeRec" type="file" accept="audio/*,video/*" capture />
      </label>
      <p id="speechWarn" class="warn hidden"></p>
    </section>

    <form id="textForm" class="text-form">
      <input id="textInput" type="text" inputmode="text" autocomplete="off"
             placeholder="也可以直接输入：抓红色" />
      <button type="submit">发送</button>
    </form>

    <section class="manual">
      <span class="label">手动测试</span>
      <div class="colors">
        <button type="button" data-color="red" class="swatch red">红色</button>
        <button type="button" data-color="white" class="swatch white">白色</button>
        <button type="button" data-color="orange" class="swatch orange">橙色</button>
      </div>
      <div class="colors">
        <button type="button" data-command="放下" class="swatch">放下</button>
        <button type="button" data-command="归位" class="swatch">归位</button>
        <button type="button" data-command="就位" class="swatch">就位</button>
      </div>
      <button id="stopBtn" type="button" class="stop">停止当前任务</button>
      <p class="fineprint">停止按钮只取消任务层，不会代替机械臂底层急停。</p>
    </section>
  </main>
  <script src="/static/app.js"></script>
</body>
</html>
