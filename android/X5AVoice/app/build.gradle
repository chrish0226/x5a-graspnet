plugins {
    id 'com.android.application'
}

android {
    namespace 'com.x5a.voice'
    compileSdk 34
    defaultConfig {
        applicationId "com.x5a.voice"
        minSdk 24
        targetSdk 34
        versionCode 4
        versionName "1.3-wrist"
    }
    buildTypes {
        release {
            minifyEnabled false
        }
        debug {
            minifyEnabled false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
}
